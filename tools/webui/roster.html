<title>アビス名簿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface2:#E9EDF2; --ink:#1B2030; --ink-dim:#5A6478;
  --line:#D4DAE3; --accent:#2F7E9E; --accent-ink:#FFFFFF;
  --passion:#C05532; --shock:#6F61C6; --warn-bg:#FBF3DC; --warn-ink:#7A5A17;
  --chip-on:#2F7E9E; --chip-on-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141F; --surface:#1A2130; --surface2:#232B3D; --ink:#E7EAF2; --ink-dim:#8E97AB;
    --line:#2E374B; --accent:#57B8D8; --accent-ink:#0D1220;
    --passion:#E07A55; --shock:#9D91E8; --warn-bg:#3A3220; --warn-ink:#E8CF8F;
    --chip-on:#57B8D8; --chip-on-ink:#0D1220;
  }
}
:root[data-theme="dark"]{
  --bg:#10141F; --surface:#1A2130; --surface2:#232B3D; --ink:#E7EAF2; --ink-dim:#8E97AB;
  --line:#2E374B; --accent:#57B8D8; --accent-ink:#0D1220;
  --passion:#E07A55; --shock:#9D91E8; --warn-bg:#3A3220; --warn-ink:#E8CF8F;
  --chip-on:#57B8D8; --chip-on-ink:#0D1220;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-size:14px; line-height:1.55;
}
.wrap{max-width:1100px; margin:0 auto; padding:20px 16px 80px}
h1{
  font-family:"DotGothic16",monospace; font-weight:400; font-size:26px; margin:0;
  letter-spacing:.04em;
}
h1 .sub{color:var(--ink-dim); font-size:13px; margin-left:10px; letter-spacing:.08em}
.topbar{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:14px}
#saveState{margin-left:auto; font-size:12px; color:var(--ink-dim)}
#saveState.saved::before{content:"●"; color:var(--accent); margin-right:4px}

.banner{background:var(--warn-bg); color:var(--warn-ink); border-radius:6px;
  padding:8px 12px; margin-bottom:12px; font-size:13px; display:none}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:12px 14px; margin-bottom:12px}
.panel-row{display:flex; gap:18px; flex-wrap:wrap; align-items:center}
.field{display:flex; align-items:center; gap:8px}
.field label{color:var(--ink-dim); font-size:13px}
.stat{display:flex; flex-direction:column; min-width:90px}
.stat .v{font-size:20px; font-family:"DotGothic16",monospace; font-variant-numeric:tabular-nums}
.stat .k{font-size:11px; color:var(--ink-dim); letter-spacing:.08em}

.filters{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.filters input[type=search]{
  background:var(--surface2); border:1px solid var(--line); color:var(--ink);
  border-radius:6px; padding:6px 10px; font:inherit; width:180px}
.chip{
  border:1px solid var(--line); background:var(--surface2); color:var(--ink);
  border-radius:999px; padding:4px 12px; cursor:pointer; font:inherit; font-size:13px}
.chip.on{background:var(--chip-on); color:var(--chip-on-ink); border-color:var(--chip-on)}
.chip:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{
  outline:2px solid var(--accent); outline-offset:1px}

.tablebox{overflow-x:auto; border:1px solid var(--line); border-radius:8px; background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:900px}
thead th{
  position:sticky; top:0; background:var(--surface2); z-index:2;
  font-size:12px; color:var(--ink-dim); font-weight:500; letter-spacing:.06em;
  text-align:left; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap}
tbody td{padding:5px 8px; border-bottom:1px solid var(--line); white-space:nowrap;
  font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tbody tr.unowned{opacity:.45}
td.name{max-width:250px; overflow:hidden; text-overflow:ellipsis}
td.name .t{color:var(--ink-dim); font-size:11px; display:block; line-height:1.2}
.pill{display:inline-block; font-size:11px; border-radius:4px; padding:1px 6px;
  font-family:"DotGothic16",monospace; letter-spacing:.05em}
.pill.SSR{background:var(--accent); color:var(--accent-ink)}
.pill.SR{background:var(--surface2); color:var(--ink); border:1px solid var(--line)}
.pill.R{background:transparent; color:var(--ink-dim); border:1px solid var(--line)}
.em{font-size:12px}
.em.情熱{color:var(--passion)} .em.衝撃{color:var(--shock)}
td .prop{font-size:12px; color:var(--ink-dim)}
input.num{
  width:52px; background:var(--surface2); border:1px solid var(--line); color:var(--ink);
  border-radius:5px; padding:4px 6px; font:inherit; text-align:right;
  font-variant-numeric:tabular-nums}
input.num:disabled{opacity:.4}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--accent); cursor:pointer}

.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px}
button.act{
  background:var(--accent); color:var(--accent-ink); border:none; border-radius:6px;
  padding:8px 14px; font:inherit; font-weight:700; cursor:pointer}
button.act.ghost{background:var(--surface2); color:var(--ink); border:1px solid var(--line); font-weight:500}
button.act.danger{background:transparent; color:var(--ink-dim); border:1px solid var(--line); font-weight:500}
textarea.io{
  width:100%; min-height:120px; background:var(--surface2); border:1px solid var(--line);
  color:var(--ink); border-radius:6px; padding:8px; font-family:ui-monospace,monospace; font-size:12px}
details{margin-top:12px}
details summary{cursor:pointer; color:var(--ink-dim)}
.hint{font-size:12px; color:var(--ink-dim); margin-top:8px}
@media (prefers-reduced-motion: no-preference){
  .chip,button.act{transition:filter .12s} .chip:hover,button.act:hover{filter:brightness(1.08)}
}
</style>

<div class="wrap">
  <div class="topbar">
    <h1>アビス名簿<span class="sub">DOT ABYSS ROSTER</span></h1>
    <span id="saveState">未保存</span>
  </div>
  <div class="banner" id="storageBanner">
    このブラウザでは localStorage が使えないため、変更は自動保存されません。下部の「JSONをコピー」で手動バックアップしてください。
  </div>

  <div class="panel">
    <div class="panel-row">
      <div class="field"><label for="syncLv">シンクロLv</label>
        <input class="num" id="syncLv" type="number" min="1" max="120" value="60"></div>
      <div class="field"><label for="barLv">酒場拡張</label>
        <select id="barLv" class="num" style="width:110px;text-align:left">
          <option value="3">3階(9人)</option><option value="2">2階(6人)</option><option value="1">1階(3人)</option>
        </select></div>
      <div style="flex:1"></div>
      <div class="stat"><span class="v" id="stOwned">0</span><span class="k">所持</span></div>
      <div class="stat"><span class="v" id="stPlace">0</span><span class="k">娼館配置可(絆1+)</span></div>
      <div class="stat"><span class="v" id="stBond">0</span><span class="k">絆Lv合計</span></div>
    </div>
  </div>

  <div class="panel filters" id="filters">
    <input type="search" id="q" placeholder="名前で検索">
    <button class="chip" data-f="rarity" data-v="SSR">SSR</button>
    <button class="chip" data-f="rarity" data-v="SR">SR</button>
    <button class="chip" data-f="rarity" data-v="R">R</button>
    <button class="chip" data-f="stance" data-v="フロント">フロント</button>
    <button class="chip" data-f="stance" data-v="バック">バック</button>
    <button class="chip" data-f="stance" data-v="アシスト">アシスト</button>
    <button class="chip" data-f="owned" data-v="1">所持のみ</button>
  </div>

  <div class="tablebox">
  <table>
    <thead><tr>
      <th>所持</th><th>キャラ</th><th>レア</th><th>所属</th><th>属性</th><th>スタンス</th>
      <th>凸</th><th>絆Lv</th><th>アビ1</th><th>アビ2</th><th>アビ3</th><th>娼館提案</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  </div>

  <div class="actions">
    <button class="act" id="copyCsv">シミュレータ用CSVをコピー</button>
    <button class="act ghost" id="copyJson">JSONをコピー</button>
    <button class="act ghost" id="showImport">JSONを読み込む</button>
    <button class="act danger" id="reset">全リセット</button>
  </div>
  <div class="hint">変更は自動でこのブラウザ（localStorage）に保存されます。CSVは <code>tools/brothel_sim.py</code> の
    <code>--roster</code> にそのまま使えます（所持かつ絆Lv1以上のキャラを出力）。</div>

  <details id="ioBox">
    <summary>エクスポート / インポート</summary>
    <textarea class="io" id="ioText" placeholder="ここに以前コピーしたJSONを貼り付けて「読み込み実行」"></textarea>
    <div class="actions">
      <button class="act ghost" id="doImport">読み込み実行</button>
    </div>
  </details>
</div>

<script>
"use strict";
const CHARS = JSON.parse(document.getElementById("charData").textContent);
const LS_KEY = "dotabyss-roster-v1";

let storageOk = true;
try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }
catch(e){ storageOk = false; document.getElementById("storageBanner").style.display="block"; }

const defaultEntry = () => ({o:false, lb:0, bond:0, a1:1, a2:1, a3:1});
let state = { sync:60, bar:3, chars:{} };

function loadState(){
  if(!storageOk) return;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const s = JSON.parse(raw);
      if(s && typeof s === "object"){ state = Object.assign(state, s); state.chars = s.chars || {}; } }
  }catch(e){ /* 壊れた保存データは無視して初期状態で開く */ }
}
let saveTimer = null;
function save(){
  if(!storageOk){ setSaved("手動バックアップ推奨"); return; }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    localStorage.setItem(LS_KEY, JSON.stringify(state));
    setSaved("保存済み");
  }, 300);
}
function setSaved(t){ const el=document.getElementById("saveState");
  el.textContent=t; el.classList.add("saved"); }

function entry(key){ if(!state.chars[key]) state.chars[key]=defaultEntry(); return state.chars[key]; }

/* ---- フィルタ ---- */
const filter = { q:"", rarity:new Set(), stance:new Set(), owned:false };
function matches(c){
  if(filter.q && !(c.key.includes(filter.q))) return false;
  if(filter.rarity.size && !filter.rarity.has(c.rarity)) return false;
  if(filter.stance.size && !filter.stance.has(c.stance)) return false;
  if(filter.owned && !entry(c.key).o) return false;
  return true;
}

/* ---- 描画 ---- */
const rowsEl = document.getElementById("rows");
function numCell(key, field, min, max){
  const e = entry(key);
  return `<td><input class="num" type="number" min="${min}" max="${max}" value="${e[field]}"
    data-k="${escapeAttr(key)}" data-f="${field}" ${e.o?"":"disabled"}></td>`;
}
function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }

function render(){
  const frag = [];
  for(const c of CHARS){
    if(!matches(c)) continue;
    const e = entry(c.key);
    frag.push(`<tr class="${e.o?"":"unowned"}">
      <td><input type="checkbox" data-k="${escapeAttr(c.key)}" data-f="o" ${e.o?"checked":""}></td>
      <td class="name"><span class="t">${escapeHtml(c.title?("【"+c.title+"】"):"")}</span>${escapeHtml(c.name)}</td>
      <td><span class="pill ${c.rarity}">${c.rarity}</span></td>
      <td>${escapeHtml(c.faction)}</td>
      <td><span class="em ${c.emblem}">${escapeHtml(c.element||"?")}</span></td>
      <td>${escapeHtml(c.stance||"?")}</td>
      ${numCell(c.key,"lb",0,9)}
      ${numCell(c.key,"bond",0,30)}
      ${numCell(c.key,"a1",1,10)}
      ${numCell(c.key,"a2",1,10)}
      ${numCell(c.key,"a3",1,10)}
      <td class="prop">${escapeHtml(c.proposal)}</td>
    </tr>`);
  }
  rowsEl.innerHTML = frag.join("");
  renderStats();
}
function renderStats(){
  let owned=0, bond=0, place=0;
  for(const c of CHARS){ const e=state.chars[c.key]; if(e&&e.o){ owned++; bond+=e.bond; if(e.bond>=1) place++; } }
  document.getElementById("stOwned").textContent = owned + "/" + CHARS.length;
  document.getElementById("stBond").textContent = bond;
  document.getElementById("stPlace").textContent = place;
}

/* ---- 入力ハンドラ（イベント委譲）---- */
rowsEl.addEventListener("change", ev=>{
  const t = ev.target, k = t.dataset.k, f = t.dataset.f;
  if(!k) return;
  const e = entry(k);
  if(f === "o"){ e.o = t.checked; render(); }
  else{
    const min = +t.min, max = +t.max;
    let v = Math.round(+t.value || 0); v = Math.max(min, Math.min(max, v));
    t.value = v; e[f] = v; renderStats();
  }
  save();
});
document.getElementById("syncLv").addEventListener("change", ev=>{
  state.sync = Math.max(1, Math.min(120, Math.round(+ev.target.value||60)));
  ev.target.value = state.sync; save();
});
document.getElementById("barLv").addEventListener("change", ev=>{ state.bar = +ev.target.value; save(); });

/* ---- フィルタUI ---- */
document.getElementById("filters").addEventListener("click", ev=>{
  const b = ev.target.closest(".chip"); if(!b) return;
  const f = b.dataset.f, v = b.dataset.v;
  b.classList.toggle("on");
  if(f === "owned"){ filter.owned = b.classList.contains("on"); }
  else{ const set = filter[f]; b.classList.contains("on") ? set.add(v) : set.delete(v); }
  render();
});
document.getElementById("q").addEventListener("input", ev=>{ filter.q = ev.target.value.trim(); render(); });

/* ---- エクスポート / インポート ---- */
function toCsv(){
  const lines = ["name,bond"];
  for(const c of CHARS){ const e=state.chars[c.key];
    if(e && e.o && e.bond >= 1) lines.push(`${c.key},${e.bond}`); }
  return lines.join("\n");
}
async function copyText(text, btn, okLabel){
  const orig = btn.textContent;
  try{ await navigator.clipboard.writeText(text); btn.textContent = okLabel; }
  catch(e){
    const box = document.getElementById("ioBox"); box.open = true;
    document.getElementById("ioText").value = text;
    btn.textContent = "下の欄からコピーしてください";
  }
  setTimeout(()=>{ btn.textContent = orig; }, 1800);
}
document.getElementById("copyCsv").addEventListener("click", ev=>{
  const n = toCsv().split("\n").length - 1;
  copyText(toCsv(), ev.target, `コピーしました（${n}人）`);
});
document.getElementById("copyJson").addEventListener("click", ev=>{
  copyText(JSON.stringify(state), ev.target, "コピーしました");
});
document.getElementById("showImport").addEventListener("click", ()=>{
  const box = document.getElementById("ioBox"); box.open = true;
  document.getElementById("ioText").focus();
});
document.getElementById("doImport").addEventListener("click", ()=>{
  const txt = document.getElementById("ioText").value.trim();
  if(!txt) return;
  try{
    const s = JSON.parse(txt);
    if(!s || typeof s !== "object" || typeof s.chars !== "object") throw new Error();
    state = { sync: s.sync||60, bar: s.bar||3, chars: s.chars };
    document.getElementById("syncLv").value = state.sync;
    document.getElementById("barLv").value = state.bar;
    render(); save(); setSaved("読み込みました");
  }catch(e){ setSaved("読み込み失敗: JSONの形式が不正です"); }
});
document.getElementById("reset").addEventListener("click", ()=>{
  if(!confirm("すべての入力を消去します。よろしいですか？")) return;
  state = { sync:60, bar:3, chars:{} };
  document.getElementById("syncLv").value = 60;
  document.getElementById("barLv").value = 3;
  render(); save();
});

/* ---- 起動 ---- */
loadState();
document.getElementById("syncLv").value = state.sync;
document.getElementById("barLv").value = state.bar;
render();
if(storageOk) setSaved(localStorage.getItem(LS_KEY) ? "保存済み" : "未入力");
</script>
